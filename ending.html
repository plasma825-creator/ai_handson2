<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ラク大エンディング</title>
  <link rel="stylesheet" href="ending/ending.css" />
</head>
<body>
  <main class="ending-page">
    <section class="opening-panel" id="startPanel">
      <p class="eyebrow">ESCAPE ENDING</p>
      <h1>エンディング</h1>
      <p>金沢国際酪農大学旭台キャンパス唱歌</p>
      <button id="startButton" class="start-button" type="button">▶ エンディング開始</button>
      <p class="note">※音声が流れます。ご注意ください。</p>
    </section>

    <section class="stage" id="stage" hidden aria-live="polite">
      <audio id="endingAudio" src="ending/ending_song.mp3" preload="auto"></audio>

      <div class="lyric-overlay" id="lyricOverlay" aria-live="polite" hidden>
        <span id="lyricLine"></span>
      </div>

      <div class="scene title-scene" id="titleScene">
        <div class="title-card">
          <p class="eyebrow">ENDING THEME</p>
          <h2>金沢国際酪農大学<br><span>旭台キャンパス唱歌</span></h2>
          <p>カコク大からの脱出</p>
        </div>
      </div>

      <div class="scene songcard-scene" id="songCardScene" hidden>
        <img
          class="school-song-card-img"
          src="ending/images/song_card.png"
          alt="金沢国際酪農大学 旭台キャンパス唱歌 歌詞カード"
        >
      </div>

</div>

      <div class="scene slide-scene" id="posterScene" hidden>
        <div class="slide-header">
          <p class="eyebrow">MISSION 2 POSTER VISUALS</p>
          <p id="posterCounter">1 / 11</p>
        </div>
        <div class="image-grid three" id="posterGrid"></div>
      </div>

      <div class="scene photo-scene" id="photoScene" hidden>
        <div class="slide-header">
          <p class="eyebrow">みなさんの様子</p>
          <p id="photoCounter">1 / 3</p>
        </div>
        <div class="photo-stage" id="photoStage"></div>
      </div>

      <div class="scene fin-scene" id="finScene" hidden>
        <h2>Fin</h2>
        <p>生成AI研修は以上です。</p>
        <p>ご参加ありがとうございました。</p>
        <a href="index.html" class="back-link">ポータルへ戻る</a>
      </div>
    </section>
  </main>

  <script src="ending/ending.js"></script>
</body>
</html>
